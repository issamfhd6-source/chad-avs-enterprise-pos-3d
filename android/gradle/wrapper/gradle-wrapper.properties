## 3. ملف `android/app/build.gradle`
أنشئ أو عدّل هذا الملف لضبط معرّف التطبيق على **`com.chadavs.pos3d`** وتضمين اسم التطبيق **`CHAD A.V.S POS 3D`** ومستوى SDK **34**:

```groovy
plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.chadavs.pos3d"
    compileSdk 34

    defaultConfig {
        applicationId "com.chadavs.pos3d"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        resValue "string", "app_name", "CHAD A.V.S POS 3D"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}
