## 2. ملف `android/build.gradle`
أنشئ أو عدّل هذا الملف لتوحيد إصدار **Kotlin** إلى **2.0.21** وفرض **SDK 34** على المشاريع الفرعية (`subprojects`) وتفادي تعارض الموارد وحزم التبعيات:

```groovy
buildscript {
    ext.kotlin_version = '2.0.21'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.3.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                compileSdkVersion 34
                defaultConfig {
                    targetSdkVersion 34
                }
            }
        }
    }
}
```[span_2](start_span)[span_2](end_span)[span_3](start_span)[span_3](end_span)

