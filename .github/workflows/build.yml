### خطوات التشغيل وتحميل التطبيق بعد الحفظ
1. اضغط على **Commit changes** لحفظ الملف؛ سيبدأ سير العمل تلقائياً في تبويب **Actions**.
2. انتظر حتى تنتهي جميع الخطوات دون مقاطعة (قد يستغرق البناء الأول عدة دقائق لتثبيت الحزم وتوليد ملفات Drift وبناء APK)[span_2](start_span)[span_2](end_span).
3. عند ظهور علامة النجاح الخضراء، ادخل إلى صفحة التشغيل، وانزل إلى قسم **Artifacts** وحمّل **`CHAD-AVS-POS-3D-release`**، ثم فك الضغط وثبّت `app-release.apk` على هاتفك.

هل بدأت تشغيل البناء في تبويب **Actions**، وهل ظهر أي تنبيه أو خطأ في أي خطوة نراجعها معاً؟
